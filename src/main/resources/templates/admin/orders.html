<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="console">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="console-head">
        <h3 class="console-head__title">All orders</h3>
        <p class="console-head__blurb">Every order on the platform. Filter by college to narrow it down.</p>
    </div>

    <form method="get" th:action="@{/admin/orders}" class="d-flex gap-2 mb-3 flex-wrap">
        <select name="tenantId" class="form-select" style="width:auto;" onchange="this.form.submit()">
            <option value="">All colleges</option>
            <option th:each="t : ${tenants}" th:value="${t.id}" th:selected="${t.id == selectedTenantId}"
                    th:text="${t.name}"></option>
        </select>
        <select name="status" class="form-select" style="width:auto;" onchange="this.form.submit()">
            <option value="">All statuses</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == selectedStatus}"
                    th:text="${s.name().replace('_',' ')}"></option>
        </select>
        <!-- The two things a student can actually give you. Until now this screen filtered
             by college and status only, so finding one person's order meant paging by eye
             or going to the support desk for its separate lookup. -->
        <input type="search" name="q" class="form-control" style="width:auto; min-width:16rem;"
               th:value="${q}" placeholder="Order token or student email"/>
        <button type="submit" class="btn btn-outline-secondary">
            <span class="material-symbols-outlined">search</span>Search
        </button>
        <a th:if="${q != null and !q.isEmpty()}" class="btn btn-link" th:href="@{/admin/orders}">Clear</a>
    </form>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-secondary">No orders match that filter.</div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(orders)}">
        <table class="table bg-white align-middle">
            <thead><tr><th>Token</th><th>College</th><th>Student</th><th>Placed</th><th>Total</th><th>Status</th></tr></thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td class="fw-bold" th:text="${o.tokenNo}">TOKEN</td>
                <td class="small text-muted" th:text="${collegeNames.get(o.tenantId)} ?: '(unknown)'">College</td>
                <td class="small" th:text="${studentNames.get(o.userId)}">Student</td>
                <td class="small text-muted" th:text="${#temporals.format(o.createdAt,'dd MMM HH:mm')}">date</td>
                <td th:text="'₹' + ${o.totalAmount}">₹0</td>
                <td><span th:replace="~{fragments/order-status :: statusBadge(${o.status})}"></span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/pager :: pager(${paged},
            @{/admin/orders(page=${paged != null ? paged.page - 1 : 0},tenantId=${selectedTenantId},status=${selectedStatus},q=${q})},
            @{/admin/orders(page=${paged != null ? paged.page + 1 : 0},tenantId=${selectedTenantId},status=${selectedStatus},q=${q})})}"></div>
</div>
</body>
</html>
