<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="console console--has-sidebar">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="console-layout">
<div th:replace="~{fragments/navbar :: adminSidebar}"></div>
<main class="console-main">
<div class="container">
    <div class="console-head">
        <h3 class="console-head__title">Grievances</h3>
        <p class="console-head__blurb">Complaints raised by students, across every college.</p>
    </div>

    <div th:if="${#lists.isEmpty(grievances)}" class="state-panel">
        <div th:replace="~{fragments/state :: medallion('check_circle','good')}"></div>
        <h4>All clear</h4>
        <p>No grievances raised across any college.</p>
    </div>

    <div class="console-filter" data-filter="#grievance-rows" data-filter-empty="#grievance-none"
         th:if="${!#lists.isEmpty(grievances)}" hidden="hidden">
        <input type="search" class="form-control console-filter__search" data-filter-search
               placeholder="Search subject, college, student or token" aria-label="Search grievances"/>
        <select class="form-select" data-filter-field="status" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.name().replace('_',' ')}"></option>
        </select>
        <button type="button" class="btn btn-outline-secondary" data-filter-clear="data-filter-clear">
            <span class="material-symbols-outlined">close</span>Clear
        </button>
        <span class="console-filter__count" data-filter-count="data-filter-count"></span>
    </div>

    <div id="grievance-none" class="console-filter-empty" hidden="hidden">No grievance matches that.</div>

    <div class="list-group" id="grievance-rows">
        <div class="list-group-item" th:each="row : ${grievances}" data-filter-row="data-filter-row"
             th:attr="data-search=${row.grievance().subject} + ' ' + ${row.collegeName} + ' ' + ${row.raisedByName}
                                  + ' ' + ${row.raisedByEmail} + ' ' + (${row.orderToken()} ?: ''),
                      data-status=${row.grievance().status}">
            <div class="d-flex justify-content-between align-items-start mb-1">
                <div>
                    <strong th:text="${row.grievance().subject}">Subject</strong>
                    <span class="text-muted small ms-2" th:text="${row.collegeName} + ' · ' + ${row.raisedByName} + ' (' + ${row.raisedByEmail} + ')'"></span>
                </div>
                <span class="badge" th:classappend="${row.grievance().status.name() == 'RESOLVED'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${row.grievance().status}"></span>
            </div>
            <p class="mb-2" th:text="${row.grievance().message}">Message</p>

            <!--/* The whole point of the order link: from a complaint, one click to the
                 order and its payment, instead of asking the student to repeat it. */-->
            <p class="mb-2 small" th:if="${row.orderToken() != null}">
                <span class="material-symbols-outlined">receipt_long</span>
                About order <strong th:text="${row.orderToken()}">TOKEN</strong>
                &middot;
                <a th:href="@{/admin/support(q=${row.orderToken()})}">Open in support desk</a>
            </p>
            <p class="mb-2 small text-muted" th:if="${row.orderToken() == null}">
                <span class="material-symbols-outlined">info</span> Not linked to a specific order.
            </p>

            <p class="mb-2 small" th:if="${row.grievance().adminResponse != null}">
                <strong>Response:</strong> <span th:text="${row.grievance().adminResponse}"></span>
            </p>

            <form method="post" th:if="${row.grievance().status.name() != 'RESOLVED'}"
                  th:action="@{/admin/grievances/{id}/resolve(id=${row.grievance().id})}" class="d-flex gap-2">
                <input type="text" name="response" class="form-control form-control-sm" placeholder="Your response" required="required"/>
                <button type="submit" class="btn btn-sm btn-success"><span class="material-symbols-outlined">check_circle</span>Resolve</button>
            </form>
        </div>
    </div>
</div>
</main>
</div>
</body>
</html>
