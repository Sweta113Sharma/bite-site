<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="console">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 480px;">
    <div class="console-head">
        <h3 class="console-head__title">System health</h3>
        <p class="console-head__blurb">Whether the app can reach the things it depends on.</p>
    </div>
    <div class="card">
        <div class="card-body d-flex align-items-center gap-3">
            <span class="icon-circle" th:classappend="${up} ? '' : 'text-danger'"
                  th:style="${up} ? '' : 'background: var(--color-danger-tint); color: var(--color-danger);'">
                <span class="material-symbols-outlined">monitor_heart</span>
            </span>
            <div>
                <span class="badge fs-6" th:classappend="${up} ? 'bg-success' : 'bg-danger'" th:text="${status}">UP</span>
                <div class="text-muted small mt-1">Backed by Spring Boot Actuator</div>
            </div>
        </div>
    </div>
    <div class="card mt-3" th:if="${paymentsDetails != null}">
        <div class="card-body">
            <div class="d-flex align-items-center gap-3 mb-3">
                <span class="icon-circle"
                      th:style="${paymentsUp} ? '' : 'background: var(--color-danger-tint); color: var(--color-danger);'">
                    <span class="material-symbols-outlined">credit_card</span>
                </span>
                <div>
                    <strong>Payments</strong>
                    <span class="badge ms-2" th:classappend="${paymentsUp} ? 'bg-success' : 'bg-danger'"
                          th:text="${paymentsUp} ? 'READY' : 'NOT CONFIGURED'">READY</span>
                </div>
            </div>
            <dl class="mb-0 small">
                <div class="d-flex justify-content-between py-1" th:each="d : ${paymentsDetails}">
                    <dt class="text-muted fw-normal" th:text="${d.key}">key</dt>
                    <dd class="mb-0 text-end" th:text="${d.value}"
                        th:classappend="${#strings.contains(d.value, 'MISSING') or d.value == 'LIVE'} ? 'text-danger fw-bold'">value</dd>
                </div>
            </dl>
        </div>
    </div>

    <p class="mt-3">
        <a th:href="@{/actuator/health}" target="_blank">Full health detail (JSON)</a> ·
        <a th:href="@{/actuator/metrics}" target="_blank">Metrics</a>
    </p>
</div>
</body>
</html>
