<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 640px;">
    <h3 class="mb-4" th:text="${tenant.name} + ' — configuration'">Configuration</h3>

    <table class="table bg-white mb-4" th:if="${!#lists.isEmpty(entries)}">
        <thead><tr><th>Key</th><th>Value</th></tr></thead>
        <tbody>
        <tr th:each="e : ${entries}">
            <td th:text="${e.configKey}">key</td>
            <td th:text="${e.configValue}">value</td>
        </tr>
        </tbody>
    </table>
    <p class="text-muted" th:if="${#lists.isEmpty(entries)}">No configuration set for this college yet.</p>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Set a config value</h5>
            <p class="text-muted small">Examples: <code>feature.ratings.enabled</code>, <code>notify.email</code>, <code>payment.gateway.override</code></p>
            <form method="post" th:action="@{/techmgr/tenants/{id}/config(id=${tenant.id})}" class="row g-2">
                <div class="col-5"><input type="text" name="key" class="form-control" placeholder="Key" required="required"/></div>
                <div class="col-5"><input type="text" name="value" class="form-control" placeholder="Value" required="required"/></div>
                <div class="col-2"><button type="submit" class="btn btn-primary w-100">Save</button></div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
