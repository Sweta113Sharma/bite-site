<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle != null ? pageTitle + ' - BiteSite' : 'BiteSite'}">BiteSite</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-mark.svg}"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="apple-touch-icon" th:href="@{/img/icons/apple-touch-icon.png}"/>
    <!-- Matches the app canvas so the Android status bar continues the page instead of
         capping it with a band of another colour. The home-screen icon below keeps the
         vivid brand terracotta — that one wants to stand out in an app grid. -->
    <meta name="theme-color" content="#F9F9F9"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="BiteSite"/>
    <!-- Bootstrap still comes from jsDelivr and is render-blocking, so the browser cannot
         paint until it has done a DNS lookup, a TCP connect and a TLS handshake with a
         host it has not spoken to yet. Warming that connection in parallel with parsing
         the rest of the head takes that cost off the critical path. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <!-- Archivo Black + Archivo: the BIG BEEF reference language. Archivo Black carries
         display/headings/buttons; Archivo carries body copy. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <style>
        /* Self-hosted Material Symbols — no CDN dependency, icons always render. */
        @font-face {
            font-family: 'Material Symbols Outlined';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('/fonts/material-symbols-outlined.woff2?v=2') format('woff2');
        }
    </style>
    <!-- Phosphor is gone: the outlet and admin portals were the last users of it, and they
         now draw from the same self-hosted Material Symbols set as the customer app. That
         removes two render-blocking CDN stylesheets from every page in the product and
         makes icons work offline, which a PWA needs. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Ordered stylesheet set. THIS ORDER IS THE CASCADE: each file may only override
         the ones above it, so the links must not be reordered and a rule must not move
         between files without checking what it then stops overriding.

         01  design tokens, read by everything below
         02  base + the overrides that retune Bootstrap to this system
         03  customer screen components
         04  sign-in and registration
         05  cross-portal state, and outlet operational controls
         06  editorial customer screens
         07  the BIG BEEF language applied to the components above
         08  final word on the customer menu, navbar and deal cards
         09  the staff portals, scoped to body.console

         Served with a content hash and a one-year immutable cache (see
         spring.web.resources.chain in application.yml), so the request count matters
         only on a first visit and every file is then free. -->
    <link rel="stylesheet" th:href="@{/css/parts/01-tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/02-base.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/03-customer.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/04-auth.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/05-shared.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/06-editorial.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/07-brutalist.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/08-customer-final.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/09-console.css}"/>
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/active-order-strip.js}" defer></script>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_parameter" th:content="${_csrf?.parameterName}"/>
</head>
<body></body>
</html>
