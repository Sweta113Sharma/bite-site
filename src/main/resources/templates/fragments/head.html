<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <!--/* viewport-fit=cover is what makes env(safe-area-inset-*) resolve to anything other
         than zero on a notched iPhone. Sixteen rules across seven stylesheets already read
         --safe-area-bottom to keep the tab bar, the sticky cart bar and the toasts clear of
         the home indicator; without this attribute every one of them was computing with a
         zero and the bar sat under the indicator on every iPhone X and later. */-->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title th:text="${pageTitle != null ? pageTitle + ' - BiteSite' : 'BiteSite'}">BiteSite</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo-mark.png}"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="apple-touch-icon" th:href="@{/img/icons/apple-touch-icon.png}"/>
    <!--/* Matches the app canvas so the Android status bar continues the page instead of
         capping it with a band of another colour. The home-screen icon below keeps the
         vivid brand terracotta — that one wants to stand out in an app grid. */-->
    <meta name="theme-color" content="#F9F9F9"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="BiteSite"/>
    <!--/* No preconnect hints any more, because there is nothing left to preconnect TO.
         Bootstrap and Archivo used to come from cdn.jsdelivr.net, fonts.googleapis.com and
         fonts.gstatic.com, which meant three DNS lookups, three TCP connects and three TLS
         handshakes with hosts the browser had never spoken to — all of it before first
         paint, since two of those responses were render-blocking stylesheets. A preconnect
         warms that work but cannot remove it. Self-hosting does: every byte a page needs
         now arrives over the one connection it already has open.

         That also puts them behind the service worker's cache-first handler (sw.js), which
         deliberately leaves third-party requests to the network — so these were previously
         the only assets a returning student on a dead connection could not get. */-->
    <style>
        /* Archivo Black + Archivo: the BIG BEEF reference language. Archivo Black carries
           display/headings/buttons; Archivo carries body copy.

           Copied from what Google Fonts itself served, unicode-range and all, so the
           browser still downloads only the subsets a page actually uses — the latin file
           for English, latin-ext only if an accented character appears. Vietnamese was
           dropped; nothing here renders Vietnamese, and a character with no face falls
           back rather than failing.

           Archivo is one variable file covering 400-700, which is what Google serves for
           all four weights this app asks for — not four static files. */
        @font-face{font-family:'Archivo';font-style:normal;font-weight:400 700;font-display:swap;src:url('/fonts/archivo-400-700-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
        @font-face{font-family:'Archivo';font-style:normal;font-weight:400 700;font-display:swap;src:url('/fonts/archivo-400-700-latin.woff2') format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
        @font-face{font-family:'Archivo Black';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/archivo-black-400-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
        @font-face{font-family:'Archivo Black';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/archivo-black-400-latin.woff2') format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

        /* Self-hosted Material Symbols — no CDN dependency, icons always render. */
        @font-face {
            font-family: 'Material Symbols Outlined';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('/fonts/material-symbols-outlined.woff2?v=3') format('woff2');
        }
    </style>
    <!--/* Phosphor is gone: the outlet and admin portals were the last users of it, and they
         now draw from the same self-hosted Material Symbols set as the customer app. That
         removes two render-blocking CDN stylesheets from every page in the product and
         makes icons work offline, which a PWA needs. */-->
    <!--/* Bootstrap 5.3.3, vendored verbatim from the same jsDelivr build it used to be
         fetched from. Served from our own origin it is content-hashed and cached for a
         year like every other stylesheet, instead of being a third-party round trip on
         the critical path of every first visit. Still loaded BEFORE the parts below,
         because the cascade note under this depends on it. */-->
    <link rel="stylesheet" th:href="@{/css/vendor/bootstrap.min.css}"/>
    <!--/* Ordered stylesheet set. THIS ORDER IS THE CASCADE: each file may only override
         the ones above it, so the links must not be reordered and a rule must not move
         between files without checking what it then stops overriding.

         01  design tokens, read by everything below
         02  base + the overrides that retune Bootstrap to this system
         03  customer screen components
         04  sign-in and registration
         05  cross-portal state, and outlet operational controls
         06  editorial customer screens
         07  the BIG BEEF language applied to the components above
         08  final word on the customer menu, navbar and deal cards
         09  the staff portals, scoped to body.console

         Served with a content hash and a one-year immutable cache (see
         spring.web.resources.chain in application.yml), so the request count matters
         only on a first visit and every file is then free. */-->
    <link rel="stylesheet" th:href="@{/css/parts/01-tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/02-base.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/03-customer.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/04-auth.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/05-shared.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/06-editorial.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/07-brutalist.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/08-customer-final.css}"/>
    <link rel="stylesheet" th:href="@{/css/parts/09-console.css}"/>
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/active-order-strip.js}" defer></script>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_parameter" th:content="${_csrf?.parameterName}"/>
</head>
<body></body>
</html>
