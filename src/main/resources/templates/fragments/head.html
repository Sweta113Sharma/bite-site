<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle != null ? pageTitle + ' - BiteSite' : 'BiteSite'}">BiteSite</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-mark.svg}"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="apple-touch-icon" th:href="@{/img/icons/apple-touch-icon.png}"/>
    <!-- Matches the app canvas so the Android status bar continues the page instead of
         capping it with a band of another colour. The home-screen icon below keeps the
         vivid brand terracotta — that one wants to stand out in an app grid. -->
    <meta name="theme-color" content="#F9F9F9"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="BiteSite"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <!-- Inter alone, as the app design ships: its type scale sets every role — display
         through label — on one family and leans on weight and tracking for hierarchy. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
    <!-- Phosphor stays for the outlet and admin portals, which share this stylesheet but
         are not part of the customer-app redesign. Dropping it would blank their icons. -->
    <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet"/>
    <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script th:src="@{/js/app.js}" defer></script>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_parameter" th:content="${_csrf?.parameterName}"/>
</head>
<body></body>
</html>
