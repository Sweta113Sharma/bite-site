<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div class="container text-center" style="margin-top: 8rem;">
    <h1 class="display-6" th:if="${tenant != null and tenant.status.name() == 'PENDING'}">
        <span th:text="${tenant.name}">This college</span> isn't live yet
    </h1>
    <h1 class="display-6" th:if="${tenant != null and tenant.status.name() == 'SUSPENDED'}">
        <span th:text="${tenant.name}">This college</span>'s ordering is temporarily paused
    </h1>
    <p class="text-muted">Please check back soon, or contact your canteen for details.</p>
    <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}" class="mt-3">
        <button class="btn btn-outline-secondary" type="submit">Sign out</button>
    </form>
</div>
</body>
</html>
