<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="auth-shell d-flex align-items-center justify-content-center">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-mark">B</div>
            <h3 class="mb-1">Sign in to BiteSite</h3>
            <p class="text-muted mb-0" style="font-size:0.92rem;">Order ahead, skip the queue.</p>
        </div>

        <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'ratelimit'}">
            Too many attempts — please wait a few minutes and try again.
        </div>
        <div class="alert alert-danger" th:if="${param.error != null and param.error[0] != 'ratelimit'}">Invalid email or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been signed out.</div>
        <div class="alert alert-success" th:if="${registered}">Account created — sign in below.</div>

        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="username" class="form-control" required="required" autofocus="autofocus"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required="required"/>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>

        <p class="mt-4 text-center mb-0" style="font-size:0.9rem;">
            New student? <a th:href="@{/register/student}">Create an account</a>
        </p>
    </div>
</div>
</body>
</html>
