<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 480px;">
    <h3 class="mb-4">Create account</h3>

    <form method="post" th:action="@{/register/student}" th:object="${form}">
        <div class="mb-3">
            <label class="form-label">College</label>
            <select th:field="*{tenantId}" class="form-select">
                <option value="" disabled selected>Choose your college</option>
                <option th:each="college : ${colleges}" th:value="${college.id}" th:text="${college.name}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('tenantId')}" th:errors="*{tenantId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" th:field="*{name}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone (optional)</label>
            <input type="text" th:field="*{phone}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Roll number (optional)</label>
            <input type="text" th:field="*{rollNo}" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-primary w-100">Create account</button>
    </form>

    <p class="mt-3 text-center">
        Already have an account? <a th:href="@{/login}">Sign in</a>
    </p>
</div>
</body>
</html>
