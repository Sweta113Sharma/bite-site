<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div class="auth-shell">
<div th:replace="~{fragments/auth-brand :: panel('Forgot it happens.','Your order history stays exactly where it is.')}"></div>
<main class="auth-main">
    <div th:replace="~{fragments/auth-brand :: lockup}"></div>
    <div class="auth-card" style="max-width: 420px;">
        <div class="mb-4">
            <span class="auth-kicker">Account recovery</span>
            <h3 class="mb-1">Reset your password</h3>
            <p class="text-muted mb-0" style="font-size:0.92rem;">
                Enter the email you signed up with and we'll send you a 6-digit code.
            </p>
        </div>
        <form method="post" th:action="@{/forgot-password}">
            <div class="mb-3">
                <label class="form-label" for="forgot-email">Email</label>
                <input type="email" name="email" id="forgot-email" class="form-control"
                       required="required" autofocus="autofocus" autocomplete="email"/>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <span class="material-symbols-outlined">send</span>Send code
            </button>
        </form>
        <p class="mt-4 text-center mb-0" style="font-size:0.9rem;">
            <a th:href="@{/login}">Back to sign in</a>
        </p>
    </div>
</main>
</div>
</body>
</html>
