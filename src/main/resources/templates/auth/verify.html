<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="auth-shell d-flex align-items-center justify-content-center">
    <div th:replace="~{fragments/auth-decor :: decor}"></div>
    <div class="auth-card" style="max-width: 440px;">
        <div class="text-center mb-4">
            <img th:src="@{/img/mascot/bito-listening.png}" alt="" class="mascot-img mascot-sm"
                 onerror="this.style.display='none'"/>
            <h3 class="mb-1">Verify your account</h3>
            <p class="text-muted mb-0" style="font-size:0.92rem;">Enter the code(s) we just sent you.</p>
        </div>

        <div class="alert alert-success" th:if="${resent}">A fresh code has been sent.</div>
        <div class="alert alert-danger" th:if="${rateLimited}">Too many resend attempts — please wait a few minutes.</div>

        <div th:if="${needsEmail}" class="mb-4">
            <h6 class="mb-2 d-flex align-items-center gap-2"><i class="ph ph-envelope-simple"></i>Email verification</h6>
            <div class="alert alert-danger py-2" th:if="${emailError}">That code is invalid or has expired.</div>
            <form method="post" th:action="@{/verify/email}" class="d-flex gap-2">
                <input type="text" name="code" class="form-control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                       placeholder="6-digit code" required="required" autocomplete="one-time-code"/>
                <button type="submit" class="btn btn-primary">Verify</button>
            </form>
            <form method="post" th:action="@{/verify/resend}" class="mt-2">
                <input type="hidden" name="channel" value="EMAIL"/>
                <button type="submit" class="btn btn-link btn-sm p-0">Resend email code</button>
            </form>
        </div>

        <div th:if="${needsPhone}" class="mb-2">
            <h6 class="mb-2 d-flex align-items-center gap-2"><i class="ph ph-device-mobile"></i>Phone verification</h6>
            <div class="alert alert-danger py-2" th:if="${phoneError}">That code is invalid or has expired.</div>
            <form method="post" th:action="@{/verify/phone}" class="d-flex gap-2">
                <input type="text" name="code" class="form-control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                       placeholder="6-digit code" required="required" autocomplete="one-time-code"/>
                <button type="submit" class="btn btn-primary">Verify</button>
            </form>
            <form method="post" th:action="@{/verify/resend}" class="mt-2">
                <input type="hidden" name="channel" value="PHONE"/>
                <button type="submit" class="btn btn-link btn-sm p-0">Resend SMS code</button>
            </form>
        </div>

        <p class="mt-4 text-center mb-0" style="font-size:0.9rem;">
            <a th:href="@{/login}">Back to sign in</a>
        </p>
    </div>
</div>
</body>
</html>
