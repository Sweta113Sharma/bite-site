<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="d-flex align-items-center gap-2 mb-4">
        <span class="live-dot"></span>
        <h3 class="m-0">Order queue</h3>
    </div>

    <div id="queue-empty" class="alert alert-secondary" th:if="${#lists.isEmpty(orders)}">
        No paid orders waiting right now.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-3" id="queue-body">
        <div class="col" th:each="order : ${orders}" th:attr="data-order-id=${order.id}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="token-badge m-0" th:text="${order.tokenNo}">TOKEN</h5>
                        <span th:replace="~{fragments/order-status :: statusBadge(${order.status})}"></span>
                    </div>
                    <ul class="small text-muted mb-3">
                        <li th:each="item : ${order.items}"
                            th:text="${item.quantity} + 'x ' + ${item.itemNameSnapshot}"></li>
                    </ul>
                    <form method="post" th:if="${order.status.name() == 'PAID'}"
                          th:action="@{/canteen/queue/{id}/status(id=${order.id})}">
                        <input type="hidden" name="newStatus" value="PREPARING"/>
                        <button type="submit" class="btn btn-sm btn-warning w-100">Start preparing</button>
                    </form>
                    <form method="post" th:if="${order.status.name() == 'PREPARING'}"
                          th:action="@{/canteen/queue/{id}/status(id=${order.id})}">
                        <input type="hidden" name="newStatus" value="READY_FOR_PICKUP"/>
                        <button type="submit" class="btn btn-sm btn-primary w-100">Mark ready</button>
                    </form>
                    <form method="post" th:if="${order.status.name() == 'READY_FOR_PICKUP'}"
                          th:action="@{/canteen/queue/{id}/status(id=${order.id})}">
                        <input type="hidden" name="newStatus" value="COMPLETED"/>
                        <button type="submit" class="btn btn-sm btn-success w-100">Mark picked up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/queue-poll.js}"></script>
</body>
</html>
