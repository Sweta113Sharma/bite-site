<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="console">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 640px;">
    <div class="console-head">
        <h3 class="console-head__title">Categories</h3>
        <p class="console-head__blurb">The sections students see on your menu, in this order.</p>
    </div>

    <div class="alert alert-success" th:if="${categoryNotice}" th:text="${categoryNotice}"></div>
    <div class="alert alert-danger" th:if="${categoryError}" th:text="${categoryError}"></div>

    <div class="outlet-admin-card" th:each="c : ${categories}">
        <div class="outlet-admin-card__head">
            <span class="outlet-admin-card__name" th:text="${c.name}">Category</span>
            <span class="badge bg-secondary"
                  th:text="${c.itemCount} + (${c.itemCount} == 1 ? ' item' : ' items')">0 items</span>
        </div>

        <form method="post" class="d-flex gap-2 mb-2"
              th:action="@{/canteen/categories/{id}/rename(id=${c.id})}">
            <input type="text" name="name" class="form-control form-control-sm" th:value="${c.name}"
                   maxlength="80" required="required" aria-label="Category name"/>
            <button type="submit" class="btn btn-sm btn-outline-secondary">Rename</button>
        </form>

        <!--/* The picture students see on this section's chip.

             Three states, and the wording changes with them, because "replace" and
             "override" are not the same offer: the image may be this canteen's own, or one
             the platform supplies for every canteen using this name, or absent entirely —
             in which case the chip still falls back to the first dish's photo as it always
             has, and nothing here is broken. Only an image this outlet uploaded can be
             removed. */-->
        <div class="d-flex align-items-center gap-3 mb-2">
            <span class="category-image-preview">
                <img th:if="${categoryImages[c.id] != null}" th:src="@{${categoryImages[c.id]}}" alt=""/>
                <span th:if="${categoryImages[c.id] == null}" class="material-symbols-outlined">restaurant</span>
            </span>
            <div class="flex-grow-1">
                <form method="post" enctype="multipart/form-data" class="d-flex gap-2 align-items-center"
                      th:action="@{/canteen/categories/{id}/image(id=${c.id})}">
                    <input type="file" name="image" class="form-control form-control-sm"
                           accept="image/png,image/jpeg,image/gif,image/bmp,image/webp" required="required"
                           th:aria-label="'Image for ' + ${c.name}"/>
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Upload</button>
                </form>
                <div class="small text-muted mt-1">
                    <span th:if="${ownImageCategoryIds.contains(c.id)}">Your own image.</span>
                    <span th:if="${!ownImageCategoryIds.contains(c.id) and categoryImages[c.id] != null}">
                        Using the platform image — upload one to override it here.
                    </span>
                    <span th:if="${categoryImages[c.id] == null}">
                        No image yet — the chip borrows the first item's photo.
                    </span>
                </div>
            </div>
            <form method="post" th:if="${ownImageCategoryIds.contains(c.id)}"
                  th:action="@{/canteen/categories/{id}/image/remove(id=${c.id})}"
                  onsubmit="return confirm('Remove your image for this category?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
            </form>
        </div>

        <div class="d-flex gap-2 flex-wrap">
            <form method="post" class="d-flex gap-2" th:action="@{/canteen/categories/{id}/order(id=${c.id})}">
                <input type="number" name="sortOrder" class="form-control form-control-sm" style="width:90px;"
                       th:value="${c.sortOrder}" aria-label="Sort order"/>
                <button type="submit" class="btn btn-sm btn-outline-secondary">Set order</button>
            </form>

            <!--/* Offered only when the section is empty. A category with items in it cannot
                 be deleted: the server refuses, and hiding the button here means the
                 manager is not invited to try. */-->
            <form method="post" th:if="${c.itemCount == 0}"
                  th:action="@{/canteen/categories/{id}/delete(id=${c.id})}"
                  onsubmit="return confirm('Delete this category?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
            <span class="text-muted small align-self-center" th:if="${c.itemCount > 0}">
                Move its items elsewhere to delete this.
            </span>
        </div>
    </div>

    <h6 class="mt-4">Add a category</h6>
    <form method="post" th:action="@{/canteen/categories}" class="d-flex gap-2">
        <input type="text" name="name" class="form-control" placeholder="e.g. Beverages"
               maxlength="80" required="required"/>
        <button type="submit" class="btn btn-primary"><span class="material-symbols-outlined">add</span>Add</button>
    </form>
</div>
</body>
</html>
