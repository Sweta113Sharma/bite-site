<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 480px;">
    <h3 class="mb-4" th:text="${pageTitle}">Menu item</h3>

    <form method="post" th:object="${form}" enctype="multipart/form-data"
          th:action="${itemId != null} ? @{/canteen/menu/{id}(id=${itemId})} : @{/canteen/menu}">
        <div class="mb-3">
            <label class="form-label">Photo (optional)</label>
            <label class="photo-dropzone">
                <input type="file" name="photo" accept="image/png,image/jpeg,image/webp"/>
                <span class="photo-dropzone-preview">
                    <img th:if="${currentPhotoPath != null}" th:src="@{${currentPhotoPath}}" alt=""/>
                    <img th:if="${currentPhotoPath == null}" th:src="@{/img/plate-placeholder.svg}" alt="" class="is-placeholder-icon"/>
                </span>
                <span class="photo-dropzone-text">
                    <strong th:text="${currentPhotoPath != null} ? 'Replace photo' : 'Add a photo'">Add a photo</strong>
                    <span>PNG, JPEG, or WebP — under 2MB</span>
                </span>
            </label>
            <!-- Only offered when there is a photo to remove. Falling back to the generated
                 illustration is a real choice: a bad phone snap reads worse than the drawing. -->
            <div class="form-check mt-2" th:if="${currentPhotoPath != null}">
                <input class="form-check-input" type="checkbox" id="removePhoto" th:field="*{removePhoto}"/>
                <label class="form-check-label small" for="removePhoto">Remove this photo and use the illustration instead</label>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select th:field="*{categoryId}" class="form-select">
                <option value="" disabled="disabled">Choose a category</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
            <div class="form-text">
                Manage the list on the <a th:href="@{/canteen/categories}">categories</a> screen.
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Price (₹)</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Flat discount price (₹, optional)</label>
            <input type="number" step="0.01" th:field="*{discountPrice}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('discountPrice')}" th:errors="*{discountPrice}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Or discount percent (%, optional)</label>
            <input type="number" step="0.01" th:field="*{discountPercent}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('discountPercent')}" th:errors="*{discountPercent}"></div>
            <div class="form-text">A flat discount price wins if both are set.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Daily limit (optional)</label>
            <input type="number" min="1" step="1" th:field="*{dailyLimit}" class="form-control" placeholder="e.g. 40"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('dailyLimit')}" th:errors="*{dailyLimit}"></div>
            <div class="form-text">
                How many you can make in a day. Once that many are ordered, the item shows as
                sold out to students until tomorrow. Leave blank for no limit.
                <span th:if="${soldToday != null and soldToday > 0}"
                      th:text="'Ordered so far today: ' + ${soldToday} + '.'">Ordered so far today: 0.</span>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100"><i class="ph ph-check"></i>Save</button>
    </form>
</div>
<script th:src="@{/js/menu-photo-upload.js}"></script>
</body>
</html>
