<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="console">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="console-head">
        <h3 class="console-head__title">Sales</h3>
        <p class="console-head__blurb" th:text="'Last ' + ${days} + ' days. Cancelled, expired and unpaid orders are excluded.'">
            Last 30 days.</p>
    </div>

    <div class="stat-row">
        <div class="stat">
            <span class="stat__label">Orders</span>
            <span class="stat__value" th:text="${totalOrders}">0</span>
        </div>
        <div class="stat stat--accent">
            <span class="stat__label">Revenue</span>
            <span class="stat__value" th:text="'₹' + ${totalRevenue}">₹0</span>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(rows)}" class="state-panel">
        <div th:replace="~{fragments/state :: medallion('assignment','neutral')}"></div>
        <h4>No sales yet</h4>
        <p>Once orders are collected they'll be totalled here by day.</p>
    </div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(rows)}">
        <table class="table bg-white">
            <thead><tr><th>Day</th><th class="num">Orders</th><th class="money">Revenue</th></tr></thead>
            <tbody>
            <tr th:each="r : ${rows}">
                <td th:text="${#temporals.format(r.day, 'EEE dd MMM')}">day</td>
                <td class="num" th:text="${r.orderCount}">0</td>
                <td class="money" th:text="'₹' + ${r.revenue}">₹0</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
