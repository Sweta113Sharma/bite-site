<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="console">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 720px;">
    <div class="console-head">
        <h3 class="console-head__title">Staff</h3>
        <p class="console-head__blurb">Who can sign in to this canteen's console.</p>
    </div>

    <div class="alert alert-success" th:if="${staffNotice}" th:text="${staffNotice}"></div>
    <div class="alert alert-danger" th:if="${staffError}" th:text="${staffError}"></div>

    <div class="console-filter" data-filter="#staff-rows" data-filter-empty="#staff-none"
         th:if="${!#lists.isEmpty(staff)}" hidden="hidden">
        <input type="search" class="form-control console-filter__search" data-filter-search
               placeholder="Search name or email" aria-label="Search staff"/>
        <select class="form-select" data-filter-field="role" aria-label="Filter by role">
            <option value="">Both roles</option>
            <option value="CANTEEN_MANAGER">Manager</option>
            <option value="CANTEEN_OPERATOR">Operator</option>
        </select>
        <select class="form-select" data-filter-field="state" aria-label="Filter by status">
            <option value="">Any status</option>
            <option value="ACTIVE">Active</option>
            <option value="OFF">Off</option>
        </select>
        <button type="button" class="btn btn-outline-secondary" data-filter-clear="data-filter-clear">
            <span class="material-symbols-outlined">close</span>Clear
        </button>
        <span class="console-filter__count" data-filter-count="data-filter-count"></span>
    </div>

    <div id="staff-none" class="console-filter-empty" hidden="hidden">Nobody matches that.</div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(staff)}">
        <table class="table bg-white align-middle">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
            <tbody id="staff-rows">
            <tr th:each="s : ${staff}" data-filter-row="data-filter-row"
                th:attr="data-search=${s.name} + ' ' + ${s.email},
                         data-role=${s.role},
                         data-state=${s.active} ? 'ACTIVE' : 'OFF'">
                <td th:text="${s.name}">Name</td>
                <td class="small text-muted" th:text="${s.email}">email</td>
                <td>
                    <span class="badge"
                          th:classappend="${s.role.name() == 'CANTEEN_MANAGER'} ? 'bg-primary' : 'bg-secondary'"
                          th:text="${s.role.name() == 'CANTEEN_MANAGER'} ? 'Manager' : 'Operator'">Role</span>
                </td>
                <td>
                    <span class="badge" th:classappend="${s.active} ? 'bg-success' : 'bg-secondary'"
                          th:text="${s.active} ? 'Active' : 'Off'">Active</span>
                </td>
                <td class="text-end">
                    <div class="d-inline-flex gap-2">
                        <form method="post"
                              th:action="@{/canteen/staff/{id}/password-reset(id=${s.id})}" class="m-0"
                              onsubmit="return confirm('Email a password reset code to this person?');">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Reset password</button>
                        </form>
                        <!--/* Both directions. This used to offer deactivate only, so
                             switching somebody off by mistake was permanent. */-->
                        <form method="post"
                              th:action="@{/canteen/staff/{id}/status(id=${s.id})}" class="m-0"
                              th:attr="onsubmit=${s.active}
                                       ? 'return confirm(\'Switch this account off? They will not be able to sign in.\');'
                                       : null">
                            <input type="hidden" name="active" th:value="${!s.active}"/>
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${s.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                    th:text="${s.active} ? 'Switch off' : 'Switch on'">Switch off</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <h6 class="mt-4">Add a staff account</h6>
    <form method="post" th:action="@{/canteen/staff}">
        <div class="mb-2">
            <select name="role" class="form-select" required="required">
                <option value="CANTEEN_OPERATOR" selected="selected">Operator — the queue and stock only</option>
                <option value="CANTEEN_MANAGER">Manager — menu, prices, and the queue</option>
            </select>
        </div>
        <div class="mb-2"><input type="text" name="name" class="form-control" placeholder="Full name" required="required"/></div>
        <div class="mb-2"><input type="email" name="email" class="form-control" placeholder="Email" required="required"/></div>
        <div class="mb-2"><input type="password" name="password" class="form-control" placeholder="Temporary password" minlength="8" required="required"/></div>
        <button type="submit" class="btn btn-primary w-100"><span class="material-symbols-outlined">person_add</span>Create account</button>
    </form>
</div>
</body>
</html>
