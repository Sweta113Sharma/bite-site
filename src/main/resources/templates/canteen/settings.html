<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="console">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 560px;">
    <div class="console-head">
        <h3 class="console-head__title" th:text="${outlet.name}">Outlet</h3>
        <p class="console-head__blurb">What students see about this canteen.</p>
    </div>

    <div class="alert alert-success" th:if="${settingsNotice}" th:text="${settingsNotice}"></div>

    <form method="post" th:action="@{/canteen/settings}">
        <div class="row g-2 mb-3">
            <div class="col">
                <label class="form-label" for="opensAt">Opens at</label>
                <input type="time" id="opensAt" name="opensAt" class="form-control"
                       th:value="${outlet.opensAt != null} ? ${#temporals.format(outlet.opensAt, 'HH:mm')} : ''"/>
            </div>
            <div class="col">
                <label class="form-label" for="closesAt">Closes at</label>
                <input type="time" id="closesAt" name="closesAt" class="form-control"
                       th:value="${outlet.closesAt != null} ? ${#temporals.format(outlet.closesAt, 'HH:mm')} : ''"/>
            </div>
        </div>
        <div class="form-text mb-3">
            Hours are shown to students but don't block ordering on their own — use
            <a th:href="@{/canteen/queue}">pause new orders</a> for that.
        </div>

        <div class="mb-3">
            <label class="form-label" for="contactPhone">Contact number</label>
            <input type="text" id="contactPhone" name="contactPhone" class="form-control" maxlength="20"
                   th:value="${outlet.contactPhone}" placeholder="Optional"/>
        </div>

        <div class="mb-3">
            <label class="form-label" for="notice">Notice</label>
            <input type="text" id="notice" name="notice" class="form-control" maxlength="200"
                   th:value="${outlet.notice}" placeholder="e.g. Closed for the festival on Friday"/>
            <div class="form-text">A short line shown on your menu.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <div class="row g-2">
                <div class="col">
                    <input type="number" step="any" id="latitude" name="latitude" class="form-control"
                           th:value="${outlet.latitude}" placeholder="Latitude" inputmode="decimal"/>
                </div>
                <div class="col">
                    <input type="number" step="any" id="longitude" name="longitude" class="form-control"
                           th:value="${outlet.longitude}" placeholder="Longitude" inputmode="decimal"/>
                </div>
            </div>
            <div class="form-text d-flex justify-content-between align-items-center">
                <span>Students pick the nearest canteen using these coordinates.</span>
                <button type="button" class="btn btn-sm btn-outline-primary" id="useMyLocation">
                    Use my location
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100"><span class="material-symbols-outlined">check</span>Save settings</button>
    </form>

    <script>
        document.getElementById('useMyLocation').addEventListener('click', () => {
            if (!navigator.geolocation) {
                return;
            }
            navigator.geolocation.getCurrentPosition((position) => {
                document.getElementById('latitude').value = position.coords.latitude.toFixed(6);
                document.getElementById('longitude').value = position.coords.longitude.toFixed(6);
            });
        });
    </script>
    </form>
</div>
</body>
</html>
