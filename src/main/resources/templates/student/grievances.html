<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="max-width: 700px;">
    <h3 class="mb-4">Support</h3>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Raise an issue</h5>
            <form method="post" th:action="@{/student/grievances}" th:object="${form}">
                <div class="mb-2">
                    <input type="text" th:field="*{subject}" class="form-control" placeholder="Subject"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
                </div>
                <div class="mb-2">
                    <textarea th:field="*{message}" class="form-control" rows="3" placeholder="Describe the issue"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>

    <h5 class="mb-3">Your past issues</h5>
    <div th:if="${#lists.isEmpty(grievances)}" class="alert alert-secondary">Nothing raised yet.</div>
    <div class="list-group">
        <div class="list-group-item" th:each="g : ${grievances}">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <strong th:text="${g.subject}">Subject</strong>
                <span class="badge" th:classappend="${g.status.name() == 'RESOLVED'} ? 'bg-success' : 'bg-secondary'" th:text="${g.status}"></span>
            </div>
            <p class="mb-1 text-muted" th:text="${g.message}">Message</p>
            <p class="mb-0 small" th:if="${g.adminResponse != null}">
                <strong>Response:</strong> <span th:text="${g.adminResponse}"></span>
            </p>
        </div>
    </div>
</div>
</body>
</html>
