<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Mobile Bottom Nav -->
<div th:replace="~{fragments/navbar :: bottomNav}"></div>

<div class="container" style="max-width: 600px;">
    
    <div class="d-flex align-items-center gap-3 mb-4 mt-2">
        <div class="icon-circle" style="width: 60px; height: 60px; font-size: 2rem;">
            <i class="ph ph-user"></i>
        </div>
        <div>
            <h3 class="m-0" th:text="${user.name}">User Name</h3>
            <div class="text-muted" th:text="${user.email}">user@example.com</div>
        </div>
    </div>

    <!-- Swiggy-style sectioned list -->
    <div class="account-section">
        <div class="account-section-title">My Account</div>
        
        <a th:href="@{/student/orders}" class="account-row">
            <i class="ph ph-receipt"></i>
            <div class="account-row-content">
                <div class="account-row-label">Order History</div>
                <div class="account-row-detail">View your past orders</div>
            </div>
            <i class="ph ph-caret-right account-row-chevron"></i>
        </a>
        
        <a th:href="@{/student/grievances}" class="account-row">
            <i class="ph ph-lifebuoy"></i>
            <div class="account-row-content">
                <div class="account-row-label">Help & Support</div>
                <div class="account-row-detail">Raise issues with past orders</div>
            </div>
            <i class="ph ph-caret-right account-row-chevron"></i>
        </a>

        <div class="account-row" style="cursor: default;">
            <i class="ph ph-bell-ringing"></i>
            <div class="account-row-content">
                <div class="account-row-label">Order notifications</div>
                <div class="account-row-detail">Get notified when your order's ready</div>
            </div>
            <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" role="switch" id="push-toggle"/>
            </div>
        </div>
    </div>

    <!-- Danger Zone -->
    <div class="account-section">
        <div class="account-section-title text-danger">Danger Zone</div>
        
        <div class="account-row" style="cursor: default;">
            <i class="ph ph-trash text-danger"></i>
            <div class="account-row-content">
                <div class="account-row-label text-danger">Delete Account</div>
                <div class="account-row-detail text-danger">This action cannot be undone</div>
            </div>
            <div>
                <form method="post" th:action="@{/student/account/delete}" onsubmit="return confirm('Are you sure you want to permanently delete your account? This cannot be undone.');" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>

    <form method="post" th:action="@{/logout}" class="mt-4 mb-5 text-center">
        <button type="submit" class="btn btn-outline-secondary w-100 py-3 d-flex justify-content-center align-items-center gap-2">
            <i class="ph ph-sign-out"></i> Log Out
        </button>
    </form>
</div>
</body>
</html>
