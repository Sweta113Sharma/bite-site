<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${#lists.isEmpty(outlets)}" class="alert alert-secondary">
        No canteen outlets are set up yet — check back soon.
    </div>

    <div th:if="${!#lists.isEmpty(outlets)}">
        <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
            <div>
                <p class="text-uppercase mb-1" style="font-size:0.75rem; letter-spacing:0.08em; color:var(--color-primary-dark); font-weight:700;">Today's menu</p>
                <h3 class="m-0" th:text="${selectedOutlet.name}">Outlet</h3>
            </div>
            <div class="d-flex align-items-center gap-2">
                <form th:if="${outlets.size() > 1}" method="get" th:action="@{/student/menu}">
                    <select name="outletId" class="form-select" onchange="this.form.submit()">
                        <option th:each="o : ${outlets}" th:value="${o.id}" th:text="${o.name}"
                                th:selected="${o.id == selectedOutlet.id}"></option>
                    </select>
                </form>
                <a class="btn btn-outline-primary" th:href="@{/student/cart}">View cart</a>
            </div>
        </div>

        <div th:if="${#maps.isEmpty(itemsByCategory)}" class="alert alert-secondary">
            Nothing on the menu right now.
        </div>

        <div th:each="entry : ${itemsByCategory}" class="mb-5">
            <h5 class="mb-3 d-flex align-items-center gap-2">
                <span style="width:6px;height:6px;border-radius:50%;background:var(--color-primary);display:inline-block;"></span>
                <span th:text="${entry.key}">Category</span>
            </h5>
            <div class="row row-cols-1 row-cols-md-2 g-3">
                <div class="col" th:each="item : ${entry.value}">
                    <div class="card h-100">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title mb-1" th:text="${item.name}">Item</h6>
                                <div class="card-price">
                                    <span th:if="${item.hasDiscount()}" class="price-strike" th:text="'₹' + ${item.price}"></span>
                                    <span th:text="'₹' + ${item.effectivePrice()}"></span>
                                </div>
                            </div>
                            <form method="post" th:action="@{/student/cart/add}" class="d-flex align-items-center gap-2">
                                <input type="hidden" name="menuItemId" th:value="${item.id}"/>
                                <input type="hidden" name="outletId" th:value="${selectedOutlet.id}"/>
                                <input type="number" name="quantity" value="1" min="1" class="form-control form-control-sm" style="width: 4.5rem;"/>
                                <button type="submit" class="btn btn-sm btn-primary">Add</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
