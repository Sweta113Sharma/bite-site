<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: activeOrderStrip}"></div>

<!-- Mobile Bottom Nav -->
<div th:replace="~{fragments/navbar :: bottomNav}"></div>

<div class="container text-center" style="max-width: 480px; margin-top: 4rem;">
    <div class="icon-circle mx-auto mb-3" style="width:64px;height:64px;font-size:1.8rem;">
        <span class="material-symbols-outlined">credit_card</span>
    </div>
    <h3 class="mb-2">Complete payment</h3>
    <p class="text-muted mb-4">
        Order token <strong th:text="${order.tokenNo}" class="token-badge">BITE-0000</strong> &middot;
        <span class="fs-5 fw-bold text-dark" th:text="'₹' + ${order.totalAmount}">0</span>
    </p>

    <div th:if="${paymentError}" class="state-panel py-3 mb-2">
        <div th:replace="~{fragments/state :: medallion('error','bad')}"></div>
        <h4 style="font-size:1.05rem;">Payment didn't go through</h4>
        <p th:text="${paymentError}">Something went wrong</p>
    </div>

    <button id="pay-btn" class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
        <span class="material-symbols-outlined">lock</span> Pay Securely via UPI
    </button>
    <!-- Only for accounts with no number on file. Everyone else is prefilled and never
         sees a form; telling them about a field they will not meet would be noise. -->
    <p class="text-muted small mb-2" th:if="${#strings.isEmpty(payerPhone)}">
        Razorpay will ask for your mobile number.
        <a th:href="@{/account/profile}">Add it to your profile</a> to skip this next time.
    </p>
    <a th:href="@{/student/cart}" class="text-muted small text-decoration-none d-inline-block mt-2">Cancel and return to cart</a>
</div>

<form id="confirm-form" method="post" th:action="@{/student/checkout/{id}/confirm(id=${order.id})}" style="display:none;">
    <input type="hidden" name="razorpay_order_id" id="f-order-id"/>
    <input type="hidden" name="razorpay_payment_id" id="f-payment-id"/>
    <input type="hidden" name="razorpay_signature" id="f-signature"/>
</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const razorpayKeyId = /*[[${razorpayKeyId}]]*/ '';
    const gatewayOrderId = /*[[${payment.razorpayOrderId}]]*/ '';
    const payerName = /*[[${payerName}]]*/ '';
    const payerEmail = /*[[${payerEmail}]]*/ '';
    const payerPhone = /*[[${payerPhone}]]*/ '';
    const amountPaise = /*[[${amountPaise}]]*/ 0;
    const tokenNo = /*[[${order.tokenNo}]]*/ '';
    /*]]>*/

    const payBtn = document.getElementById('pay-btn');

    /* One place to say something went wrong. Replaces the previous silence: a dismissed
       modal and a declined card both used to leave the button sitting there with no
       indication of what had happened, which reads as the app being broken. */
    function showNotice(message, tone) {
        const existing = document.getElementById('pay-notice');
        if (existing) existing.remove();
        payBtn.insertAdjacentHTML('afterend',
            '<div id="pay-notice" class="alert alert-' + tone + ' mt-3 mb-0">' + message + '</div>');
    }

    /* Both checkouts end here. The signature is verified server-side before anything is
       marked paid — see CheckoutController.confirm. Nothing here is trusted. */
    function confirmPayment(response) {
        document.getElementById('f-order-id').value = response.razorpay_order_id;
        document.getElementById('f-payment-id').value = response.razorpay_payment_id;
        document.getElementById('f-signature').value = response.razorpay_signature;
        if (typeof haptic === 'function') haptic('success');
        payBtn.disabled = true;
        payBtn.textContent = 'Confirming payment…';
        document.getElementById('confirm-form').submit();
    }

    function paymentFailed(reason) {
        payBtn.disabled = false;
        if (typeof haptic === 'function') haptic('error');
        showNotice((reason || 'Your payment could not be completed.') +
            ' Nothing was charged — you can try again.', 'danger');
    }

    function checkoutOptions() {
        return {
            key: razorpayKeyId,
            amount: amountPaise,
            currency: 'INR',
            name: 'BiteSite',
            description: 'Order ' + tokenNo,
            order_id: gatewayOrderId,
            /* Razorpay asks for contact and email before it will take a payment, and with
               nothing prefilled it asked every student, every time — at the one moment in
               the product where friction costs an order. The account already holds all
               three. Phone is optional at registration, so it can still be blank; Razorpay
               then asks for just that one field instead of the whole form. */
            prefill: {
                name: payerName,
                email: payerEmail,
                contact: payerPhone
            }
        };
    }

    /* The Android shell runs this same page in a WebView, and the web checkout does not
       survive there. Capacitor sends every navigation whose host is not ours out to the
       system browser, iframes included, and Razorpay's flow moves through its own domains
       and then the bank's 3-D Secure page — hosts that cannot be allow-listed ahead of
       time. The native SDK keeps the whole payment outside the WebView and hands back the
       same three fields, so nothing downstream changes. */
    function openNativeCheckout() {
        window.Capacitor.Plugins.Checkout.open(checkoutOptions())
            .then((result) => {
                /* The plugin puts Razorpay's payload under `response`. Its own typings call
                   that a string while the Android side resolves an object, so accept both
                   rather than trust either. */
                let data = result && result.response;
                if (typeof data === 'string') {
                    try { data = JSON.parse(data); } catch (e) { data = null; }
                }
                if (data && data.razorpay_payment_id) {
                    confirmPayment(data);
                } else {
                    paymentFailed('We could not read the payment confirmation.');
                }
            })
            .catch((err) => {
                /* Rejection carries Razorpay's error object as the message, and a user who
                   simply backed out of the sheet arrives here too. Both leave the order held. */
                let reason = '';
                try {
                    reason = JSON.parse(err && err.message).description || '';
                } catch (e) {
                    reason = (err && err.message) || '';
                }
                payBtn.disabled = false;
                if (typeof haptic === 'function') haptic('warning');
                showNotice((reason || 'Payment cancelled.') +
                    ' Your order is still held — tap Pay to try again.', 'warning');
            });
    }

    function openCheckout() {
        const notice = document.getElementById('pay-notice');
        if (notice) notice.remove();

        if (window.Capacitor?.isNativePlatform?.() && window.Capacitor.Plugins?.Checkout) {
            openNativeCheckout();
            return;
        }

        const rzp = new Razorpay({
            ...checkoutOptions(),
            handler: confirmPayment,
            modal: {
                ondismiss: function () {
                    /* Closing the modal is not an error — the order is still awaiting
                       payment and the same button reopens it. Say so plainly. */
                    payBtn.disabled = false;
                    if (typeof haptic === 'function') haptic('warning');
                    showNotice('Payment cancelled. Your order is still held — tap Pay to try again.', 'warning');
                }
            }
        });

        /* A declined card, an expired UPI collect, insufficient funds. Razorpay reports
           these through this event rather than the handler, so without it a failed
           payment looked identical to nothing happening. */
        rzp.on('payment.failed', function (response) {
            paymentFailed(response && response.error && response.error.description);
        });

        rzp.open();
    }

    payBtn.addEventListener('click', openCheckout);
    if (!razorpayKeyId) {
        payBtn.disabled = true;
        showNotice('Payments aren\'t configured on this server yet.', 'warning');
    }
</script>
</body>
</html>
