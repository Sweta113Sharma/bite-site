<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Mobile Bottom Nav -->
<div th:replace="~{fragments/navbar :: bottomNav}"></div>

<div class="container">
    <div class="page-header">
        <h3 class="page-header-title">Order history</h3>
        <p class="page-header-sub">Review your past orders and track anything still on the way.</p>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="state-panel">
        <div th:replace="~{fragments/state :: medallion('receipt_long','neutral')}"></div>
        <h4>No orders yet</h4>
        <p>Once you place an order, you'll be able to track it here.</p>
        <a class="btn btn-primary" th:href="@{/student/menu}"><span class="material-symbols-outlined">restaurant</span>Browse the menu</a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-3" th:if="${!#lists.isEmpty(orders)}">
        <div class="col" th:each="order : ${orders}">
            <a th:href="@{/student/orders/{id}(id=${order.id})}" class="order-card">
                <div class="order-card-header">
                    <div>
                        <div class="text-muted small text-uppercase mb-1" style="font-size: 0.7rem; letter-spacing: 0.04em;">Order Token</div>
                        <div class="order-card-token" th:text="${order.tokenNo}">TOKEN</div>
                    </div>
                    <span th:replace="~{fragments/order-status :: statusBadge(${order.status})}"></span>
                </div>
                
                <ul class="order-card-lines">
                    <!-- Capped at four so a large order can't run the card down the
                         page; the count below picks up whatever is left. -->
                    <li th:each="item, iter : ${order.items}" th:if="${iter.index < 4}">
                        <span class="qty" th:text="${item.quantity} + '×'">1x</span><span th:text="${item.itemNameSnapshot}">Item</span>
                    </li>
                    <li class="more" th:if="${#lists.size(order.items) > 4}"
                        th:text="'+ ' + (${#lists.size(order.items)} - 4) + ' more'">+ 1 more</li>
                    <li class="more" th:if="${#lists.isEmpty(order.items)}">No items</li>
                </ul>
                
                <div class="order-card-reason" th:if="${order.status.name() == 'CANCELLED' and order.cancellationReason != null}">
                    <span class="material-symbols-outlined">info</span><span th:text="${order.cancellationReason}">Reason</span>
                </div>

                <hr style="border-color: var(--color-border); margin: 12px 0;"/>
                
                <div class="order-card-footer">
                    <div class="order-card-date" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</div>
                    <div class="order-card-total" th:text="'₹' + ${order.totalAmount}">₹0</div>
                </div>

                <!-- Inlined rather than hoisted into th:with: th:if has precedence 300
                     and th:with 600, so a variable declared here would not exist yet
                     when the condition is evaluated. -->
                <div class="order-card-track"
                     th:if="${order.status.name() == 'AWAITING_PAYMENT' or order.status.name() == 'PAID'
                             or order.status.name() == 'PREPARING' or order.status.name() == 'READY_FOR_PICKUP'}">
                    <span>Track order</span><span class="material-symbols-outlined">arrow_forward</span>
                </div>
            </a>

            <!-- Outside the card's anchor: a form nested in an <a> is invalid markup.
                 Offered only on finished orders — there is no sense reordering something
                 that is still being made. -->
            <form method="post" th:action="@{/student/orders/{id}/reorder(id=${order.id})}" class="mt-2"
                  th:if="${order.status.name() == 'COMPLETED' or order.status.name() == 'CANCELLED'}">
                <button type="submit" class="btn btn-sm btn-outline-secondary w-100">
                    <span class="material-symbols-outlined ms-16">refresh</span> Order this again
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
