<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: activeOrderStrip}"></div>
<div th:replace="~{fragments/navbar :: bottomNav}"></div>

<div class="container" style="max-width: 640px;">
    <div class="text-center mb-4">
        <div th:replace="~{fragments/state :: medallion('storefront','neutral')}"></div>
        <p class="page-header-label" style="text-align:center;">Welcome back</p>
        <h3 class="page-header-title" style="text-align:center;">Which canteen today?</h3>
    </div>

    <div class="d-flex flex-column gap-3">
        <a class="outlet-card" th:each="outlet : ${outlets}"
           th:href="@{/student/menu(outletId=${outlet.id})}">
            <div class="outlet-card-icon"><span class="material-symbols-outlined">storefront</span></div>
            <div>
                <p class="outlet-card-name" th:text="${outlet.name}">Outlet</p>
                <p class="outlet-card-hint">Tap to see today's menu</p>
            </div>
            <span class="material-symbols-outlined outlet-card-chevron">chevron_right</span>
        </a>
    </div>
</div>
</body>
</html>
