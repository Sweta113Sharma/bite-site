<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: bottomNav}"></div>

<div class="container" style="max-width: 640px;">
    <div class="text-center mb-4">
        <img th:src="@{/img/mascot/bito-hero.png}" alt="" class="mascot-img mascot-sm"
             onerror="this.style.display='none'"/>
        <p class="page-header-label" style="text-align:center;">Welcome back</p>
        <h3 class="page-header-title" style="text-align:center;">Which canteen today?</h3>
    </div>

    <div class="d-flex flex-column gap-3">
        <a class="outlet-card" th:each="outlet : ${outlets}"
           th:href="@{/student/menu(outletId=${outlet.id})}">
            <div class="outlet-card-icon"><i class="ph ph-storefront"></i></div>
            <div>
                <p class="outlet-card-name" th:text="${outlet.name}">Outlet</p>
                <p class="outlet-card-hint">Tap to see today's menu</p>
            </div>
            <i class="ph ph-caret-right outlet-card-chevron"></i>
        </a>
    </div>
</div>
</body>
</html>
