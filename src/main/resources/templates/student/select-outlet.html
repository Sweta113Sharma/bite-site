<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: activeOrderStrip}"></div>
<div th:replace="~{fragments/navbar :: bottomNav}"></div>

<div class="container" style="max-width: 640px;">
    <!--/* The college's own crest, not a generic storefront glyph.

         A student only ever sees their own college here, so this is the one screen where
         naming it is worth the space: it confirms the account landed in the right place
         before they pick a counter. `currentTenant` is a global model attribute set from
         the resolved tenant (GlobalModelAttributes), which the interceptor has already
         put in TenantContext from cache — so this costs no query.

         Colleges without an uploaded logo fall back to the medallion that was here
         before, rather than to a broken image or an empty box. */-->
    <div class="text-center mb-4">
        <div th:if="${currentTenant != null and currentTenant.logoPath != null}"
             class="college-crest">
            <img th:src="@{${currentTenant.logoPath}}" th:alt="${currentTenant.name}"/>
        </div>
        <!--/* The condition sits on a WRAPPER, not on the th:replace itself. Thymeleaf
             processes th:replace at precedence 100 and th:if at 300, so a th:if on the
             same tag is evaluated after the tag has already been replaced — the fragment
             renders unconditionally and the screen shows a crest AND a medallion. */-->
        <div th:if="${currentTenant == null or currentTenant.logoPath == null}">
            <div th:replace="~{fragments/state :: medallion('storefront','neutral')}"></div>
        </div>
        <p class="page-header-label" style="text-align:center;"
           th:text="${currentTenant != null ? currentTenant.name : 'Welcome back'}">Welcome back</p>
        <h3 class="page-header-title" style="text-align:center;">Which canteen today?</h3>
        <p class="text-muted small">Choose an outlet to browse today's menu</p>
    </div>

    <!-- Empty state if no active canteens -->
    <div th:if="${outlets == null or #lists.isEmpty(outlets)}" class="state-panel">
        <h4>No canteens open</h4>
        <p>There are no active canteens taking orders at the moment.</p>
    </div>

    <!-- Outlet cards rendered instantly server-side -->
    <div th:if="${outlets != null and !#lists.isEmpty(outlets)}" class="d-flex flex-column gap-3" id="outlet-list">
        <a th:each="outlet : ${outlets}" class="outlet-card"
           th:href="@{/student/menu(outletId=${outlet.id})}"
           th:attr="data-outlet-id=${outlet.id},data-lat=${outlet.latitude},data-lng=${outlet.longitude},data-outlet-name=${outlet.name}">
            <div class="outlet-card-icon">
                <img th:if="${outlet.logoPath != null}" th:src="@{${outlet.logoPath}}" alt=""/>
                <span th:if="${outlet.logoPath == null}" class="material-symbols-outlined">storefront</span>
            </div>
            <div class="flex-grow-1">
                <div class="d-flex align-items-center gap-2">
                    <p class="outlet-card-name" th:text="${outlet.name}">Canteen</p>
                    <span class="d-none nearest-badge" style="font-size:0.72rem; color:#15803d; background:#dcfce7; padding:2px 8px; border-radius:999px; font-weight:600;">Nearest</span>
                </div>
                <p class="outlet-card-hint">Tap to see today's menu</p>
            </div>
            <span class="material-symbols-outlined outlet-card-chevron">chevron_right</span>
        </a>
    </div>
</div>

<script th:inline="javascript">
/*<![CDATA[*/
    // Instant feedback on click
    document.querySelectorAll('.outlet-card').forEach(card => {
        card.addEventListener('click', () => {
            card.classList.add('is-loading');
            const hint = card.querySelector('.outlet-card-hint');
            if (hint) hint.textContent = 'Opening menu...';
            const name = card.dataset.outletName || 'canteen';
            if (typeof window.showPageTransitionLoader === 'function') {
                window.showPageTransitionLoader('restaurant', 'Opening ' + name + ' menu...');
            }
        });
    });

    // Haversine distance in km
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Optional background geolocation to tag nearest outlet without blocking the page
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const userLat = pos.coords.latitude;
                const userLng = pos.coords.longitude;
                let nearestCard = null;
                let minDistance = Infinity;

                document.querySelectorAll('.outlet-card').forEach(card => {
                    const lat = parseFloat(card.dataset.lat);
                    const lng = parseFloat(card.dataset.lng);
                    if (isNaN(lat) || isNaN(lng)) return;
                    const d = calculateDistance(userLat, userLng, lat, lng);
                    if (d < minDistance) {
                        minDistance = d;
                        nearestCard = card;
                    }
                });

                if (nearestCard && minDistance <= 50) {
                    const badge = nearestCard.querySelector('.nearest-badge');
                    if (badge) badge.classList.remove('d-none');
                    // Gently promote nearest card to the top
                    const list = document.getElementById('outlet-list');
                    if (list && list.firstElementChild !== nearestCard) {
                        list.prepend(nearestCard);
                    }
                }
            },
            () => { /* Geolocation ignored or refused — cards already rendered cleanly */ },
            { enableHighAccuracy: false, timeout: 2500, maximumAge: 60000 }
        );
    }
/*]]>*/
</script>
</body>
</html>
