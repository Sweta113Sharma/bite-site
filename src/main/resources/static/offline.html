<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>You're offline - BiteSite</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: #FDF5EA;
            color: #2C2018;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .card { max-width: 380px; }
        img { width: 108px; height: auto; margin-bottom: 1.25rem; }
        h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.5rem; }
        p { color: #6A5644; font-size: 0.95rem; line-height: 1.5; margin: 0 0 1.5rem; }
        button {
            font: inherit;
            font-weight: 600;
            font-size: 0.92rem;
            color: #fff;
            background: #457C5C;
            border: none;
            border-radius: 999px;
            padding: 0.65rem 1.4rem;
            cursor: pointer;
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
<div class="card">
    <img src="/img/logo-mark-pastel.svg" alt="" onerror="this.style.display='none'"/>
    <h1>You're offline</h1>
    <p>BiteSite needs a connection to show the menu, your cart, and order status — none of that is safe to guess at from a cache. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
