<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="BiteSite">
  <!-- A red slab in a heavy black keyline with a bite out of the top edge. Square rather
       than round because the design system is hard edges and 0-2px radii, and the bite is
       the name said once.

       Built as two evenodd paths so the black reads as a uniform 6-unit rim, including
       around the notch: the red's notch is the black's notch outset by the same 6, which
       a stroke would not give (a stroke would ride the centre of the path and thin out
       on the curve). Same construction as the outlet mark, so the two apps are siblings. -->
  <path fill="#14100d" fill-rule="evenodd"
        d="M6 6 H94 V94 H6 Z
           M33 6 a17 17 0 1 0 34 0 a17 17 0 1 0 -34 0 Z"/>
  <path fill="#e8281e" fill-rule="evenodd"
        d="M12 12 H88 V88 H12 Z
           M27 6 a23 23 0 1 0 46 0 a23 23 0 1 0 -46 0 Z"/>
</svg>
