<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-hidden="true">
  <!-- Watermark variant: used oversized, bled off a corner at low opacity behind the brand
       panel. Two offset slabs rather than one so the shape still reads when most of it is
       cropped away, and no keyline because at 32% opacity a black rim turns to mud. -->
  <path fill="#f0a87c" fill-rule="evenodd"
        d="M20 20 H98 V98 H20 Z
           M42 20 a17 17 0 1 0 34 0 a17 17 0 1 0 -34 0 Z"/>
  <path fill="#f2ead9" fill-rule="evenodd"
        d="M4 4 H82 V82 H4 Z
           M26 4 a17 17 0 1 0 34 0 a17 17 0 1 0 -34 0 Z"/>
</svg>
