spring:
  application:
    name: bitesite

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bitesite_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  uploads:
    # Directory for tenant logo uploads, outside the classpath so it survives across
    # jar restarts and can be swapped for an S3-backed implementation later.
    logo-dir: ${LOGO_UPLOAD_DIR:./uploads/logos}
  order:
    payment-timeout-minutes: ${PAYMENT_TIMEOUT_MINUTES:10}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

logging:
  level:
    com.bitesite: INFO
