# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy JAR app to Azure Web App: bitesite-app'

on:
  push:
    branches:
    - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java version
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'
    
    # Tests run in ci.yml (with the MySQL service container the security integration
    # tests need) on every push — this workflow's job is building and shipping a jar,
    # not re-validating what's already been validated.
    - name: Build with Maven
      run: mvn -DskipTests clean package

    # v2 ships a jar through Kudu's ZIP Deploy, which extracts the archive and then
    # rsyncs it into wwwroot. That is the step this workflow was failing on: a 20-minute
    # upload followed by rsync of a single file erroring instantly, while the app kept
    # serving the previous build — so pushes looked successful and shipped nothing.
    #
    # v3 with type: jar uses the OneDeploy API instead, which hands Azure the artifact
    # directly with no extract-and-sync stage. That is the same path `az webapp deploy
    # --type jar` takes, and it is what actually got the current build onto the site.
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'bitesite-app'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_492918a811ff43a0ace5cf7efce68199 }}
        package: '${{ github.workspace }}/target/*.jar'
        type: 'jar'
